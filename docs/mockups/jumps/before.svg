-side-name{font-size:10.5px;font-style:italic;fill:var(--qsfc-label)}.qsfc-look-textbook .qsfc-code{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;font-size:11px;white-space:pre;fill:var(--qsfc-code)}.qsfc-look-textbook .qsfc-action-box{fill:var(--qsfc-box-fill);stroke:var(--qsfc-box-stroke);stroke-width:1.1}.qsfc-look-textbook .qsfc-action-head{fill:var(--qsfc-head-fill);stroke:none}.qsfc-look-textbook .qsfc-action-sep,.qsfc-look-textbook .qsfc-action-link,.qsfc-look-textbook .qsfc-tname-link{fill:none;stroke:var(--qsfc-box-stroke);stroke-width:1.1}.qsfc-look-textbook .qsfc-qualifier{font-size:10.5px;font-weight:700;fill:var(--qsfc-head-text)}.qsfc-look-textbook .qsfc-action-name{font-size:10px;fill:var(--qsfc-head-text)}.qsfc-look-textbook .qsfc-trans-bar{fill:var(--qsfc-trans-bar)}.qsfc-look-textbook .qsfc-tname-box{fill:var(--qsfc-tname-fill);stroke:var(--qsfc-tname-stroke);stroke-width:1}.qsfc-look-textbook .qsfc-tname{font-size:10.5px;font-weight:400;font-style:italic;fill:var(--qsfc-tname)}.qsfc-look-textbook .qsfc-jump-label{font-size:10.5px;font-style:italic;fill:var(--qsfc-label)}</style>
