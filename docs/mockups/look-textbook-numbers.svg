e-name" x="35" y="439.8" text-anchor="end">pack</text><path class="qsfc-action-link" d="M85 436H103"/><g class="qsfc-action"><title>packer [:=] 1;</title><rect class="qsfc-action-box" x="103" y="414" width="128" height="44"/><path class="qsfc-action-sep" d="M123 414V458"/><text class="qsfc-qualifier" x="113" y="440" text-anchor="middle">N</text><text class="qsfc-code" x="130" y="439.5">packer [:=] 1;</text></g></g><g class="qsfc-step" data-id="s4"><title>label (Step_004)</title><rect class="qsfc-step-box" x="288" y="414" width="44" height="44"/><text class="qsfc-name" x="310" y="440.7" text-anchor="middle">5</text><text class="qsfc-side-name" x="282" y="439.8" text-anchor="end">label</text><path class="qsfc-action-link" d="M332 436H350"/><g class="qsfc-action"><title>printer [:=] 1;</title><rect class="qsfc-action-box" x="350" y="414" width="135" height="44"/><path class="qsfc-action-sep" d="M370 414V458"/><text class="qsfc-qualifier" x="360" y="440" text-anchor="middle">N</text><text class="qsfc-code" x="377" y="439.5">printer [:=] 1;</text></g></g><g class="qsfc-step" data-id="s5"><title>reject (Step_005)</title><rect class="qsfc-step-box" x="501" y="352" width="44" height="44"/><text class="qsfc-name" x="523" y="378.7" text-anchor="middle">6</text><text class="qsfc-side-name" x="495" y="377.8" text-anchor="end">reject</text><path class="qsfc-action-link" d="M545 374H563"/><g class="qsfc-action"><title>pusher [:=] 1;</title><rect class="qsfc-action-box" x="563" y="352" width="128" height="44"/><path class="qsfc-action-sep" d="M583 352V396"/><text class="qsfc-qualifier" x="573" y="378" text-anchor="middle">N</text><text class="qsfc-code" x="590" y="377.5">pusher [:=] 1;</text></g></g><g class="qsfc-step" data-id="s6"><title>done (Step_006)</title><rect class="qsfc-step-box" x="41" y="538" width="44" height="44"/><text class="qsfc-name" x="63" y="564.7" text-anchor="middle">7</text><text class="qsfc-side-name" x="35" y="563.8" text-anchor="end">done</text></g></g>
