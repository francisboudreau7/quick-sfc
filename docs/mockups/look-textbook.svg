<g class="qsfc-transitions"><g class="qsfc-transition" data-id="t0"><title>start: start_btn AND safety_ok</title><rect class="qsfc-trans-bar" x="73" y="95" width="24" height="4"/><text class="qsfc-tname" x="65" y="100.8" text-anchor="end">(start)</text><text class="qsfc-code qsfc-cond" x="106" y="100.8">start_btn AND safety_ok</text></g><g class="qsfc-transition qsfc-auto" data-id="t1"><title>fill.DN</title><rect class="qsfc-trans-bar" x="73" y="193" width="24" height="4"/><text class="qsfc-code qsfc-cond" x="106" y="198.8">fill.DN</text></g><g class="qsfc-transition" data-id="t2"><title>good: quality_ok</title><rect class="qsfc-trans-bar" x="73" y="317" width="24" height="4"/><text class="qsfc-tname" x="65" y="322.8" text-anchor="end">(good)</text><text class="qsfc-code qsfc-cond" x="106" y="322.8">quality_ok</text></g><g class="qsfc-transition" data-id="t3"><title>packed: pack_done AND label_done</title><rect class="qsfc-trans-bar" x="73" y="503" width="24" height="4"/><text class="qsfc-tname" x="65" y="508.8" text-anchor="end">(packed)</text><text class="qsfc-code qsfc-cond" x="106" y="508.8">pack_done AND label_done</text></g><g class="qsfc-transition" data-id="t4"><title>bad: NOT quality_ok</title><rect class="qsfc-trans-bar" x="504" y="317" width="24" height="4"/><text class="qsfc-tname" x="496" y="322.8" text-anchor="end">(bad)</text><text class="qsfc-code qsfc-cond" x="537" y="322.8">NOT quality_ok</text></g><g class="qsfc-transition qsfc-auto" data-id="t5"><title>reject_done</title><rect class="qsfc-trans-bar" x="504" y="428" width="24" height="4"/><text class="qsfc-code qsfc-cond" x="537" y="433.8">reject_done</text></g><g class="qsfc-transition qsfc-auto" data-id="t6"><title>TRUE</title><rect class="qsfc-trans-bar" x="73" y="601" width="24" height="4"/><text class="qsfc-code qsfc-cond" x="106" y="606.8">TRUE</text></g></g>
