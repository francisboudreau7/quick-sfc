<svg xmlns="http://www.w3.org/2000/svg" class="qsfc qsfc-look-textbook" viewBox="-17 -16 742 662" width="742" height="662" role="img">
<style>.qsfc-look-textbook{--qsfc-bg:#ffffff;--qsfc-line:#111111;--qsfc-box-fill:#ffffff;--qsfc-box-stroke:#111111;--qsfc-name:#111111;--qsfc-caption:#444444;--qsfc-code:#111111;--qsfc-head-fill:#ffffff;--qsfc-head-text:#111111;--qsfc-tname-fill:#ffffff;--qsfc-tname-stroke:#111111;--qsfc-tname:#333333;--qsfc-trans-bar:#111111;--qsfc-label:#333333;}@media (prefers-color-scheme: dark){.qsfc-look-textbook:not(.qsfc-light *){--qsfc-bg:#141414;--qsfc-line:#e6e6e6;--qsfc-box-fill:#141414;--qsfc-box-stroke:#e6e6e6;--qsfc-name:#f2f2f2;--qsfc-caption:#bbbbbb;--qsfc-code:#eeeeee;--qsfc-head-fill:#141414;--qsfc-head-text:#eeeeee;--qsfc-tname-fill:#141414;--qsfc-tname-stroke:#e6e6e6;--qsfc-tname:#cccccc;--qsfc-trans-bar:#eeeeee;--qsfc-label:#cccccc;}}.qsfc-dark .qsfc-look-textbook{--qsfc-bg:#141414;--qsfc-line:#e6e6e6;--qsfc-box-fill:#141414;--qsfc-box-stroke:#e6e6e6;--qsfc-name:#f2f2f2;--qsfc-caption:#bbbbbb;--qsfc-code:#eeeeee;--qsfc-head-fill:#141414;--qsfc-head-text:#eeeeee;--qsfc-tname-fill:#141414;--qsfc-tname-stroke:#e6e6e6;--qsfc-tname:#cccccc;--qsfc-trans-bar:#eeeeee;--qsfc-label:#cccccc;}.qsfc-look-textbook .qsfc-bg{fill:var(--qsfc-bg)}.qsfc-look-textbook text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:var(--qsfc-name)}.qsfc-look-textbook .qsfc-wire,.qsfc-look-textbook .qsfc-wire-line{fill:none;stroke:var(--qsfc-line);stroke-width:1.5;stroke-linejoin:miter}.qsfc-look-textbook g.qsfc-wire{stroke:none}.qsfc-look-textbook .qsfc-arrow{fill:var(--qsfc-line);stroke:none}.qsfc-look-textbook .qsfc-bar{fill:none;stroke:var(--qsfc-line);stroke-width:1.6}.qsfc-look-textbook .qsfc-step-box,.qsfc-look-textbook .qsfc-step-inner{fill:var(--qsfc-box-fill);stroke:var(--qsfc-box-stroke);stroke-width:1.5}.qsfc-look-textbook .qsfc-step-inner{fill:none}.qsfc-look-textbook .qsfc-name{font-size:13px;font-weight:400;fill:var(--qsfc-name)}.qsfc-look-textbook .qsfc-caption{font-size:9.5px;fill:var(--qsfc-caption)}.qsfc-look-textbook .qsfc-side-name{font-size:10.5px;font-style:italic;fill:var(--qsfc-label)}.qsfc-look-textbook .qsfc-code{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;font-size:11px;white-space:pre;fill:var(--qsfc-code)}.qsfc-look-textbook .qsfc-action-box{fill:var(--qsfc-box-fill);stroke:var(--qsfc-box-stroke);stroke-width:1.1}.qsfc-look-textbook .qsfc-action-head{fill:var(--qsfc-head-fill);stroke:none}.qsfc-look-textbook .qsfc-action-sep,.qsfc-look-textbook .qsfc-action-link,.qsfc-look-textbook .qsfc-tname-link{fill:none;stroke:var(--qsfc-box-stroke);stroke-width:1.1}.qsfc-look-textbook .qsfc-qualifier{font-size:10.5px;font-weight:700;fill:var(--qsfc-head-text)}.qsfc-look-textbook .qsfc-action-name{font-size:10px;fill:var(--qsfc-head-text)}.qsfc-look-textbook .qsfc-trans-bar{fill:var(--qsfc-trans-bar)}.qsfc-look-textbook .qsfc-tname-box{fill:var(--qsfc-tname-fill);stroke:var(--qsfc-tname-stroke);stroke-width:1}.qsfc-look-textbook .qsfc-tname{font-size:10.5px;font-weight:400;font-style:italic;fill:var(--qsfc-tname)}.qsfc-look-textbook .qsfc-jump-label,.qsfc-look-textbook .qsfc-xref-from{font-size:10.5px;font-style:italic;fill:var(--qsfc-label)}</style>
