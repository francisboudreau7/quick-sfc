ass="qsfc-qualifier" x="135" y="434" text-anchor="middle">N</text><text class="qsfc-code" x="152" y="433.5">packer [:=] 1;</text></g></g><g class="qsfc-step" data-id="s4"><title>label (Step_004)</title><rect class="qsfc-step-box" x="279" y="408" width="46" height="44"/><text class="qsfc-name" x="302" y="434.7" text-anchor="middle">label</text><path class="qsfc-action-link" d="M325 430H343"/><g class="qsfc-action"><title>printer [:=] 1;</title><rect class="qsfc-action-box" x="343" y="408" width="135" height="44"/><path class="qsfc-action-sep" d="M363 408V452"/><text class="qsfc-qualifier" x="353" y="434" text-anchor="middle">N</text><text class="qsfc-code" x="370" y="433.5">printer [:=] 1;</text></g></g><g class="qsfc-step" data-id="s5"><title>reject (Step_005)</title><rect class="qsfc-step-box" x="491" y="346" width="50" height="44"/><text class="qsfc-name" x="516" y="372.7" text-anchor="middle">reject</text><path class="qsfc-action-link" d="M541 368H559"/><g class="qsfc-action"><title>pusher [:=] 1;</title><rect class="qsfc-action-box" x="559" y="346" width="128" height="44"/><path class="qsfc-action-sep" d="M579 346V390"/><text class="qsfc-qualifier" x="569" y="372" text-anchor="middle">N</text><text class="qsfc-code" x="586" y="371.5">pusher [:=] 1;</text></g></g><g class="qsfc-step" data-id="s6"><title>done (Step_006)</title><rect class="qsfc-step-box" x="63" y="532" width="44" height="44"/><text class="qsfc-name" x="85" y="558.7" text-anchor="middle">done</text></g></g>
</svg>
