<h1>Phase 4c: user experience (mockups)</h1>
<p class="lead">Four visible additions, drawn on a simplified app window. The language parts (<code>after 5s</code>, <code>fill.done</code>, the <code>io</code> block, header lines) are shown in the last panel.</p>

<figure style="grid-column:1/-1"><figcaption>E. The language parts of 4c</figcaption>
<pre><span class="k">program</span> tank <span class="s">"Tank filling"</span>      <span class="c">// title for printing and the Program description</span>
<span class="k">course</span> <span class="s">"GEI-243"</span>                   <span class="c">// header lines (printed in the title block)</span>
<span class="k">author</span> <span class="s">"Francis B."</span>

<span class="k">io</span>                                   <span class="c">// I/O mapping: exported as alias tags</span>
  start_btn   Local:1:I.Data.0  <span class="s">"Start button"</span>
  valve       Local:2:O.Data.3
<span class="k">end</span>

<span class="k">init</span> idle
<span class="k">--</span> start_btn
<span class="k">step</span> fill
  <span class="k">on</span> valve
<span class="k">--</span> <span class="k">after</span> 5s                         <span class="c">// = fill.T >= 5000 (the step above)</span>
<span class="k">step</span> check
<span class="k">--</span> fill.done OR check.time > 2000    <span class="c">// readable members: .active .done .time .first = .X .DN .T .FS</span></pre>
<p>All of this exports to plain Studio L5X. The <code>io</code> alias tags and the Program description are new L5X shapes, to verify in Studio (a tp13 in the test pack).</p></figure>
