<style>.qsfc-look-studio{--qsfc-bg:#ffffff;--qsfc-line:#4b5159;--qsfc-box-fill:#ffffff;--qsfc-box-stroke:#4b5159;--qsfc-name:#1a5fb4;--qsfc-caption:#6b7280;--qsfc-code:#24292f;--qsfc-head-fill:#edf1f6;--qsfc-head-text:#3d4450;--qsfc-tname-fill:#f4f6f9;--qsfc-tname-stroke:#8a929c;--qsfc-tname:#1a5fb4;--qsfc-trans-bar:#24292f;--qsfc-label:#5b6470;}@media (prefers-color-scheme: dark){.qsfc-look-studio:not(.qsfc-light *){--qsfc-bg:#1c1f24;--qsfc-line:#9aa4af;--qsfc-box-fill:#23272e;--qsfc-box-stroke:#9aa4af;--qsfc-name:#79b0ff;--qsfc-caption:#8d96a0;--qsfc-code:#d5dbe1;--qsfc-head-fill:#2c323a;--qsfc-head-text:#c3cad2;--qsfc-tname-fill:#2a3038;--qsfc-tname-stroke:#6f7983;--qsfc-tname:#79b0ff;--qsfc-trans-bar:#d5dbe1;--qsfc-label:#9aa4af;}}.qsfc-dark .qsfc-look-studio{--qsfc-bg:#1c1f24;--qsfc-line:#9aa4af;--qsfc-box-fill:#23272e;--qsfc-box-stroke:#9aa4af;--qsfc-name:#79b0ff;--qsfc-caption:#8d96a0;--qsfc-code:#d5dbe1;--qsfc-head-fill:#2c323a;--qsfc-head-text:#c3cad2;--qsfc-tname-fill:#2a3038;--qsfc-tname-stroke:#6f7983;--qsfc-tname:#79b0ff;--qsfc-trans-bar:#d5dbe1;--qsfc-label:#9aa4af;}.qsfc-look-studio .qsfc-bg{fill:var(--qsfc-bg)}.qsfc-look-studio text{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:var(--qsfc-name)}.qsfc-look-studio .qsfc-wire,.qsfc-look-studio .qsfc-wire-line{fill:none;stroke:var(--qsfc-line);stroke-width:1.5;stroke-linejoin:miter}.qsfc-look-studio g.qsfc-wire{stroke:none}.qsfc-look-studio .qsfc-arrow{fill:var(--qsfc-line);stroke:none}.qsfc-look-studio .qsfc-xref .qsfc-wire-line,.qsfc-look-studio .qsfc-xref-in .qsfc-wire-line{fill:none;stroke:var(--qsfc-line);stroke-width:1.5;stroke-dasharray:4 3}.qsfc-look-studio .qsfc-bar{fill:none;stroke:var(--qsfc-line);stroke-width:1.5}.qsfc-look-studio .qsfc-step-box,.qsfc-look-studio .qsfc-step-inner{fill:var(--qsfc-box-fill);stroke:var(--qsfc-box-stroke);stroke-width:1.25}.qsfc-look-studio .qsfc-step-inner{fill:none}.qsfc-look-studio .qsfc-name{font-size:12.5px;font-weight:600;fill:var(--qsfc-name)}.qsfc-look-studio .qsfc-caption{font-size:9.5px;fill:var(--qsfc-caption)}.qsfc-look-studio .qsfc-side-name{font-size:10.5px;font-style:italic;fill:var(--qsfc-label)}.qsfc-look-studio .qsfc-code{font-family:ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;font-size:11px;white-space:pre;fill:var(--qsfc-code)}.qsfc-look-studio .qsfc-action-box{fill:var(--qsfc-box-fill);stroke:var(--qsfc-box-stroke);stroke-width:1.1}.qsfc-look-studio .qsfc-action-head{fill:var(--qsfc-head-fill);stroke:none}.qsfc-look-studio .qsfc-action-sep,.qsfc-look-studio .qsfc-action-link,.qsfc-look-studio .qsfc-tname-link{fill:none;stroke:var(--qsfc-box-stroke);stroke-width:1.1}.qsfc-look-studio .qsfc-qualifier{font-size:10.5px;font-weight:700;fill:var(--qsfc-head-text)}.qsfc-look-studio .qsfc-action-name{font-size:10px;fill:var(--qsfc-head-text)}.qsfc-look-studio .qsfc-trans-bar{fill:var(--qsfc-trans-bar)}.qsfc-look-studio .qsfc-tname-box{fill:var(--qsfc-tname-fill);stroke:var(--qsfc-tname-stroke);stroke-width:1}.qsfc-look-studio .qsfc-tname{font-size:10px;font-weight:600;fill:var(--qsfc-tname)}.qsfc-look-studio .qsfc-jump-label,.qsfc-look-studio .qsfc-xref-from{font-size:10.5px;font-style:italic;fill:var(--qsfc-label)}</style>
